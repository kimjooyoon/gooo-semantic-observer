name: conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go-1-27-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Run Go checks, build, and observer scenarios
        run: ./scripts/conformance.sh
      - name: Upload observer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: semantic-observer-conformance
          path: artifacts/conformance
          if-no-files-found: error
